services:
  backend:
    build: ./backend
    container_name: backend
    command: flask run --host=0.0.0.0

  frontend:
    container_name: frontend-build
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - '8080:3000'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - FAST_REFRESH=true
      - HOST=0.0.0.0
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend:/app
      - /app/node_modules
