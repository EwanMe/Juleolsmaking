<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Øl Score Prediktor</title>
    <!-- Last inn Tailwind CSS via CDN for enkel styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#ffc107', // Øl-gul/gull
                        'secondary': '#343a40', // Mørk bakgrunn
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gray-100">

    <div class="w-full max-w-lg bg-white shadow-xl rounded-xl p-8 transition-all duration-300">
        <h1 class="text-3xl font-bold text-center text-secondary mb-6">Juleøl Score Prediktor 🍺</h1>
        <p class="text-center text-gray-600 mb-8">Estimer score basert på nøkkelfaktorer.</p>

        <form id="predictionForm" class="space-y-4">
            
            <!-- Bryggeri -->
            <label class="block">
                <span class="text-sm font-medium text-gray-700">Bryggeri</span>
                <input type="text" id="bryggeri" value="Macks Ølbryggeri" required 
                       class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-3 border">
            </label>

            <!-- Type -->
            <label class="block">
                <span class="text-sm font-medium text-gray-700">Type</span>
                <input type="text" id="type" value="Bokkøl" required 
                       class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-3 border">
            </label>

            <div class="grid grid-cols-3 gap-4">
                <!-- ABV -->
                <label class="block">
                    <span class="text-sm font-medium text-gray-700">ABV (%)</span>
                    <input type="number" id="abv" step="0.001" value="0.09" required 
                           class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-3 border">
                </label>

                <!-- Volum (L) -->
                <label class="block">
                    <span class="text-sm font-medium text-gray-700">Volum (L)</span>
                    <input type="number" id="volum_l" step="0.01" value="0.33" required 
                           class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-3 border">
                </label>

                <!-- Pris (kr) -->
                <label class="block">
                    <span class="text-sm font-medium text-gray-700">Pris (kr)</span>
                    <input type="number" id="pris_kr" step="0.01" value="47.8" required 
                           class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-3 border">
                </label>
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full py-3 mt-6 bg-primary text-secondary font-semibold rounded-lg shadow-md hover:bg-yellow-600 transition duration-150 ease-in-out disabled:opacity-50">
                Beregn Prediksjon
            </button>
        </form>

        <!-- Resultatvisning -->
        <div id="resultContainer" class="mt-8 p-6 border-l-4 border-primary bg-yellow-50 rounded-lg shadow-inner hidden">
            <p class="text-lg font-semibold text-gray-800">Predikert Total Score:</p>
            <p id="predictionResult" class="text-4xl font-extrabold text-primary mt-1"></p>
        </div>

        <div id="loading" class="mt-4 text-center text-gray-500 hidden">
            Laster...
        </div>

        <div id="error" class="mt-4 text-center text-red-600 hidden">
            En feil oppstod. Sjekk konsollen for detaljer.
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const predictionResult = document.getElementById('predictionResult');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            
            // Skjul resultater/feilmeldinger, vis lasting
            resultContainer.classList.add('hidden');
            errorDiv.classList.add('hidden');
            loading.classList.remove('hidden');
            submitBtn.disabled = true;

            const data = {
                bryggeri: document.getElementById('bryggeri').value,
                type: document.getElementById('type').value,
                // Konverterer til tall
                abv: parseFloat(document.getElementById('abv').value),
                volum_l: parseFloat(document.getElementById('volum_l').value),
                pris_kr: parseFloat(document.getElementById('pris_kr').value)
            };

            // NB: Vi bruker '/predict' fordi Nginx vil videresende dette til Flask!
            const apiEndpoint = '/predict'; 

            try {
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });

                const result = await response.json();

                if (response.ok) {
                    predictionResult.textContent = result.predicted_score_total;
                    resultContainer.classList.remove('hidden');
                } else {
                    errorDiv.textContent = `API-feil: ${result.error || 'Ukjent feil'}`;
                    errorDiv.classList.remove('hidden');
                    console.error("API Error Response:", result);
                }

            } catch (e) {
                errorDiv.textContent = 'Nettverksfeil. Sjekk at Flask-API er operativt.';
                errorDiv.classList.remove('hidden');
                console.error("Fetch Error:", e);
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
