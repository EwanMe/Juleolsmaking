server {
    listen 80;
    server_name localhost;

    # Root for statiske filer (frontend)
    root /usr/share/nginx/html;
    index index.html;

    # Ruter alle andre kall til index.html (for enkelthet)
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy-oppsett: Videresender kall til /predict til Flask-tjenesten
    # Merk: 'flask:5000' bruker Docker Compose service-navnet
    location /predict {
        proxy_pass http://flask:5000/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}